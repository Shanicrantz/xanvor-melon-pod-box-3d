<style>

</style>
<div id="gate"><form id="gate-form"><img src="brand/xanvor-horizontal-brass-transparent.svg" alt="XANVOR"><h2>Melon Pod Box</h2><p>Private review</p><input id="pw" type="password" placeholder="Password" autocomplete="off" autofocus><button type="submit">Enter</button><div id="msg"></div></form></div>
<header><img src="brand/xanvor-horizontal-brass-transparent.svg" alt="XANVOR"><div class="title"><h1>Melon Pod Box</h1><p>XV-BL-11 · Cast brass · Lift-off lid</p></div></header>
<nav>

</nav>
<div class="layout" id="layout"><div id="stage"><div class="wm"></div><svg id="lines"></svg><div class="dim" id="dx"></div><div class="dim" id="dy"></div><div class="dim" id="dz"></div><div class="dim" id="sl0"></div><div class="dim" id="sl1"></div></div>

<script type="module">
import * as T from 'three';import{OrbitControls}from './vendor/OrbitControls.js';import{GLTFLoader}from './vendor/GLTFLoader.js';import{DRACOLoader}from './vendor/DRACOLoader.js';import{RoomEnvironment}from './vendor/RoomEnvironment.js';
const $=id=>document.getElementById(id),stage=$('stage');
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(stage.clientWidth,stage.clientHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;stage.prepend(renderer.domElement);renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

function stop(){playing=false;$('play').textContent='Play open / close'}

function stoneDir(i){const a=data.stones[SN[i]].axis,ax=new T.Vector3(a[0],a[2],-a[1]);return ax.multiplyScalar(.012).add(new T.Vector3(i?.01:-.01,.022,0))}
function stoneTick(){if(!root||!data||!stoneNodes[0])return;stoneOut+=(stoneTarget-stoneOut)*.12;if(Math.abs(stoneTarget-stoneOut)<.002)stoneOut=stoneTarget;
 SN.forEach((n,i)=>{const o=stoneNodes[i],s=data.stones[n];o.position.copy(stoneHome[i]).add(stoneDir(i).multiplyScalar(stoneOut));const el=$('sl'+i),show=$('stone-marks').checked&&control.visible&&$('view').value!=='underside';el.style.display=show?'block':'none';if(!show)return;
 const c=s.centre_mm,w=new T.Vector3(c[0]/1000,c[2]/1000,-c[1]/1000).add(stoneDir(i).multiplyScalar(stoneOut)).add(new T.Vector3(0,control.position.y+.014,0)),p=project(w);
 el.innerHTML=`${n} stone ${num(s.stone_length)} × ${num(s.stone_width)} × ${num(s.stone_height)} ${unit()}<br>seat ${num(s.seat_length)} × ${num(s.seat_width)}, ${num(s.seat_depth)} deep`;const off=Math.min(130,stage.clientWidth*.18);el.style.left=Math.max(95,Math.min(stage.clientWidth-95,p[0]+(i?off:-off)))+'px';el.style.top=Math.max(22,Math.min(stage.clientHeight-22,p[1]-(i?0:30)))+'px'})}
function stoneCard(){if(!data)return'';const u=unit();return`<div class="drawing-card wide"><h3>Stones and seats (${u}) · length × width × height</h3><table class="st"><tr><th>Stone</th><th>Stone</th><th>Seat opening</th><th>Seat depth</th></tr>${SN.map(n=>{const s=data.stones[n];return`<tr><td>${n}</td><td>${num(s.stone_length)} × ${num(s.stone_width)} × ${num(s.stone_height)}</td><td>${num(s.seat_length)} × ${num(s.seat_width)}</td><td>${num(s.seat_depth)}</td></tr>`}).join('')}</table>${stoneImg?`<img src="${stoneImg}" alt="Stones and seats" style="width:100%;display:block">`:''}</div>`}
function drawings(){if(!drawingData||!data)return;const p=$('part').value,m=data.sizes_mm[p];$('drawing-note').textContent=labels[p]+' · closed';
 $('drawing-cards').innerHTML=['top','front','side'].map(view=>{const d=drawingData[p][view],b=d.projected_bounds_px,on=$('marks').checked,h=view==='side'?m[1]:m[0],v=view==='top'?m[1]:m[2];const x1=b[0],x2=b[2],y1=b[1],y2=b[3],yb=Math.min(630,y2+27),xr=Math.min(868,x2+28);

function project(v){const p=v.clone().project(camera);return[(p.x*.5+.5)*stage.clientWidth,(-p.y*.5+.5)*stage.clientHeight]}

 const box=selectedBox(),a=box.min,b=box.max,c=box.getCenter(new T.Vector3()),p=.006,sz=selectedSize,plan=['top','underside'].includes($('view').value),zw=plan?b.z+p:c.z;
 const L=[[[a.x,a.y-p,zw],[b.x,a.y-p,zw],sz.x,'dx'],[[b.x+p,a.y-p,a.z],[b.x+p,a.y-p,b.z],sz.z,'dy']];if(plan)$('dz').style.display='none';else L.push([[b.x+p,a.y,c.z],[b.x+p,b.y,c.z],sz.y,'dz']);
 $('lines').innerHTML=L.map(([u,w,val,id])=>{const P=project(new T.Vector3(...u)),Q=project(new T.Vector3(...w)),el=$(id);if(Math.hypot(P[0]-Q[0],P[1]-Q[1])<30){el.style.display='none';return''}el.style.display='block';el.textContent=fmt(val);el.style.left=Math.max(40,Math.min(stage.clientWidth-40,(P[0]+Q[0])/2))+'px';el.style.top=Math.max(15,Math.min(stage.clientHeight-15,(P[1]+Q[1])/2))+'px';return`<path d="M${P[0]},${P[1]}L${Q[0]},${Q[1]}" stroke="#4A0F1B" stroke-width="1.4"/>`}).join('')}
$('open').onclick=()=>{stop();setLift(1,true)};$('closed').onclick=()=>{stop();setLift(0,true)};$('lift').oninput=()=>{stop();setLift(Number($('lift').value)/100,true)};
$('play').onclick=()=>{if(playing){stop();return}$('part').value='whole';filter();setLift(1,true);playStart=performance.now();playing=true;$('play').textContent='Pause'};
$('part').onchange=filter;$('units').onchange=()=>{recalc();drawings()};$('view').onchange=pose;$('marks').onchange=drawings;
$('stones-btn').onclick=()=>{stoneTarget=stoneTarget?0:1;$('stones-btn').textContent=stoneTarget?'Set stones':'Remove stones'};
$('drawing-toggle').onclick=()=>{const hide=!$('drawings').classList.contains('hidden');$('drawings').classList.toggle('hidden',hide);$('layout').classList.toggle('no-drawing',hide);$('drawing-toggle').textContent=hide?'Show Drawing':'Hide Drawing'};
$('zoom-drawing').onclick=()=>{zoom=!zoom;$('zoom-drawing').textContent=zoom?'Fit':'Zoom';drawings()};
$('reset').onclick=()=>{stop();$('part').value='whole';$('view').value='perspective';$('units').value='mm';$('marks').checked=true;$('stone-marks').checked=true;stoneTarget=0;$('stones-btn').textContent='Remove stones';setLift(0);filter()};
const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16))),jpg=b=>URL.createObjectURL(new Blob([b],{type:'image/jpeg'}));
